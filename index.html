<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Mandy</title>
  <link rel="stylesheet" href="./src/scss/main.css">
  <link rel="stylesheet" href="./src/scss/splash.scss">
</head>
<body>
<!-- Simple Splash Overlay -->
<div class="splash-overlay" id="splashOverlay">
  <div id="splash-container"></div>
</div>

<div id="app"></div>

<div id="experience" class="tarot">
  <canvas id="experience-canvas" class="experience-canvas"></canvas>
</div>

<section id="section-cylinder" class="content-section">
  <button class="section-close" onclick="closeSection()">×</button>

  <div class="section-content">
    <h1>Shows</h1>
    <ul id="upcoming-shows">Loading shows…</ul>
  </div>

  <div class="section-content">
    <h1>Archives</h1>
    <ul id="archived-shows">Loading shows…</ul>
  </div>
</section>

<section id="section-mirror" class="content-section">
  <button class="section-close" onclick="closeSection()">×</button>
  <div class="section-content">
    <h1></h1>
    <p></p>
    
    <!-- YouTube Video Grid -->
    <div class="video-grid">
      <!-- Replace VIDEO_ID_1, VIDEO_ID_2, etc. with actual YouTube video IDs -->
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube.com/embed/1YvP-CI18ms?si=hsgq7CwXVa94VX5I" 
          title="YouTube video 1"
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube.com/embed/EMjaH2vlqL4?si=jWsjPWmZpLu_VIt3" 
          title="YouTube video 2"
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube.com/embed/bbJ56QWENSY?si=w9qqv4hpz0FZut9g" 
          title="YouTube video 3"
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
      <!-- Add more video wrappers as needed -->
    </div>
  </div>
</section>

<section id="section-circle" class="content-section">
  <button class="section-close" onclick="closeSection()">×</button>
  <div class="section-content">
    <h1>Contact</h1>
    <p>Email:itsmandysemail@gmail.com</p>
  </div>
  <div class="social-icons">
            <a href="https://www.instagram.com/mandyspublicaccount?igsh=MWw5dW5wczB4eXFiNQ==" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://youtube.com/@itsmandy-tv?si=I4PvEwtLL9211UMR" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="https://open.spotify.com/artist/2xwkAUxlbTDrnzVn9TtHV8?si=SJwmu4HKSLu8xHwhFjQfpg" target="_blank" title="Spotify"><i class="fab fa-spotify"></i></a>
            <a href="https://mandys.bandcamp.com/" target="_blank" title="Bandcamp"><i class="fab fa-bandcamp"></i></a>
            <a href="https://on.soundcloud.com/hj3S9BEAchoydj1dCl" target="_blank" title="Soundcloud"><i class="fab fa-soundcloud"></i></a>
        </div>
</section>

<section id="section-star" class="content-section">
  <button class="section-close" onclick="closeSection()">×</button>
  <div class="section-content">
    <h1>Star Section</h1>
    <p>Add your content for the Star object here.</p>
  </div>
</section>

<section id="section-curve" class="content-section">
  <button class="section-close" onclick="closeSection()">×</button>
  <div class="section-content">
    <!-- Mobile Button -->
    <button id="nina-protocol-btn" class="mobile-embed-btn">
      Open Nina Protocol
    </button>
    <!-- Desktop Embed -->
    <div class="desktop-embed">
      <iframe src="https://www.ninaprotocol.com/hubs/itsmandy" title="Nina Protocol"></iframe>
    </div>
  </div>
</section>


<section id="section-lipstick" class="content-section">
  <button class="section-close" onclick="closeSection()">×</button>
  <div class="section-content">
    <h1>Lipstick Section</h1>
    <p>Add your content for the Lipstick object here.</p>
  </div>
</section>

<!-- Magic 8-Ball placeholder -->
<div id="magic8ball-container"></div>

<script type="module" src="./src/main.js"></script>
<script type="module" src="./src/splash.js"></script>
</body>
</html>
